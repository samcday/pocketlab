[Config]
MinimumVersion=26
Dependencies=rootfs

[Distribution]
Distribution=fedora
Release=rawhide
Architecture=arm64

[Output]
Format=none
Output=pocketlab
OutputDirectory=mkosi.output
CompressOutput=no
SplitArtifacts=
RepartDirectories=
# Keep the selector image from installing a second Fedora tree. Real artifacts
# are produced by mkosi.images/rootfs and, when selected, mkosi.images/device.
Overlay=yes

[Content]
SkeletonTrees=
Bootable=no
Bootloader=none
UnifiedKernelImages=none
KernelModulesInitrd=no
MakeInitrd=no
Ssh=never

[Build]
CacheDirectory=mkosi.cache
BuildDirectory=mkosi.builddir
Incremental=yes
